services:

  postgres:
    image: postgres:17

    container_name: agent-postgres

    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent_password
      POSTGRES_DB: enterprise_agent

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U agent -d enterprise_agent

      interval: 5s
      timeout: 3s
      retries: 10


  redis:
    image: redis:7

    container_name: agent-redis

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data


volumes:
  postgres_data:
  redis_data:
